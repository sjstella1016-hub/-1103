<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 문장 전시실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── 분위기별 색상 토큰 ───────────────────────── */
  body[data-mood="calm"]  { --bg:#E3E8EA; --surface:#F2F4F4; --ink:#22323A; --muted:#5B6E77; --accent:#4F7181; --line:#C2CCD0; --on-accent:#FFFFFF; --error:#A33A2C; color-scheme:light; }
  body[data-mood="warm"]  { --bg:#F3DDA5; --surface:#FBF0D3; --ink:#3A2709; --muted:#735325; --accent:#9C4E16; --line:#D9BA76; --on-accent:#FFFFFF; --error:#9B2318; color-scheme:light; }
  body[data-mood="night"] { --bg:#121A31; --surface:#1B2544; --ink:#ECE7D6; --muted:#A3AAC2; --accent:#E3BE55; --line:#33406A; --on-accent:#121A31; --error:#FF9C8A; color-scheme:dark; }

  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:16px; line-height:1.6;
    transition:background-color .6s ease, color .6s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  [hidden] { display:none !important; }

  .app { max-width:1200px; margin:0 auto; padding:clamp(20px, 4vw, 48px); display:flex; flex-direction:column; gap:clamp(24px, 4vw, 40px); min-height:100vh; }

  /* ── 상단 ─────────────────────────────────── */
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; }
  .brand { margin:0; font-family:"Gowun Batang", serif; font-size:1.375rem; font-weight:700; letter-spacing:-.01em; }
  .mode-switch { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface); }
  .mode-switch input, .chips input { position:absolute; opacity:0; pointer-events:none; }
  .mode-switch label { padding:6px 14px; border-radius:999px; font-size:.875rem; font-weight:500; color:var(--muted); cursor:pointer; }
  .mode-switch input:checked + label { background:var(--ink); color:var(--bg); }
  .mode-switch input:focus-visible + label, .chips input:focus-visible + label { outline:3px solid var(--accent); outline-offset:2px; }
  .mode-switch input:disabled + label, .chips input:disabled + label { cursor:not-allowed; opacity:.55; }

  /* ── 좌우 배치 (모바일은 세로) ───────────────── */
  .layout { flex:1; display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:clamp(24px, 4vw, 56px); align-items:start; }
  @media (max-width: 820px) { .layout { grid-template-columns:1fr; } }

  /* ── 입력 영역 ─────────────────────────────── */
  .panel { display:flex; flex-direction:column; gap:22px; }
  .field-label, legend { display:block; font-weight:600; margin-bottom:8px; padding:0; }
  textarea, .text-input {
    width:100%; padding:14px 16px; font:inherit; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    transition:border-color .2s;
  }
  textarea { min-height:170px; resize:vertical; line-height:1.7; }
  textarea:focus, .text-input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  [aria-invalid="true"] { border-color:var(--error) !important; }
  .field-foot { display:flex; justify-content:space-between; gap:12px; margin-top:6px; font-size:.8125rem; color:var(--muted); }
  .counter.is-near { color:var(--accent); font-weight:600; }

  fieldset { border:0; margin:0; padding:0; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips label {
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface);
    cursor:pointer; font-size:.9375rem;
  }
  .chips input:checked + label { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); font-weight:600; }
  .swatch { width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.2); }
  .swatch.calm { background:#B7C6CC; } .swatch.warm { background:#E9B654; } .swatch.night { background:#1B2544; }
  .chip-note { font-size:.75rem; color:var(--muted); font-weight:400; }

  .ai-settings { display:flex; flex-direction:column; gap:18px; padding:18px; border:1px solid var(--line); border-radius:8px; }
  .ai-settings-title { margin:0; font-weight:600; }
  .note { margin:0; font-size:.8125rem; color:var(--muted); }
  .note.is-warning { color:var(--error); }

  .example-only { display:flex; align-items:center; gap:8px; font-size:.875rem; color:var(--muted); }

  .submit {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:15px 20px; border:0; border-radius:6px;
    font:inherit; font-weight:600; font-size:1rem;
    background:var(--accent); color:var(--on-accent); cursor:pointer; transition:filter .2s;
  }
  .submit:hover:not(:disabled) { filter:brightness(1.08); }
  .submit:disabled { cursor:progress; opacity:.75; }
  .spinner { width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .ghost { padding:7px 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); font:inherit; font-size:.875rem; cursor:pointer; }
  .ghost:hover { border-color:var(--ink); }

  /* 진행 상태 */
  .progress { padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar span { display:block; height:100%; width:35%; background:var(--accent); animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(290%); } }
  .steps { list-style:none; margin:14px 0 0; padding:0; display:grid; gap:6px; font-size:.875rem; }
  .steps li { display:flex; align-items:center; gap:10px; color:var(--muted); }
  .steps li::before { content:""; flex:none; width:10px; height:10px; border-radius:50%; border:1.5px solid currentColor; }
  .steps li[data-state="active"] { color:var(--ink); font-weight:600; }
  .steps li[data-state="active"]::before { background:var(--accent); border-color:var(--accent); }
  .steps li[data-state="done"]::before { background:currentColor; }
  .progress-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; }
  .progress-foot .note { flex:1; }

  /* 상태·오류 */
  .status { min-height:1.6em; margin:0; font-size:.9375rem; color:var(--muted); }
  .status[data-type="success"] { color:var(--ink); }
  .notice { padding:14px 16px; border-left:3px solid var(--error); background:color-mix(in srgb, var(--error) 10%, var(--surface)); }
  .notice-title { margin:0 0 4px; font-weight:600; color:var(--error); }
  .notice-hint { margin:0 0 12px; font-size:.9375rem; }

  /* ── 결과 영역: 전시 벽 ──────────────────────── */
  .wall {
    position:sticky; top:24px; display:flex; flex-direction:column; justify-content:center;
    min-height:440px; padding:clamp(28px, 5vw, 64px);
    background:var(--surface); border-left:6px solid var(--accent);
    transition:opacity .3s, background-color .6s;
  }
  @media (max-width: 820px) { .wall { position:static; min-height:320px; } }
  .wall[aria-busy="true"] { opacity:.55; }
  .empty { margin:0; max-width:34em; color:var(--muted); font-family:"Gowun Batang", serif; font-size:1.0625rem; line-height:1.9; }
  .result { max-width:36em; }
  .wall-meta { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 28px; font-size:.8125rem; }
  .tag { padding:3px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); }
  .tag.source[data-source="example"] { border-style:dashed; }
  .tag.source[data-source="ai"] { border-color:var(--accent); color:var(--accent); }
  .ex-title {
    margin:0 0 24px; font-family:"Gowun Batang", serif; font-weight:700;
    font-size:clamp(2.1rem, 5vw, 3.9rem); line-height:1.2; letter-spacing:-.02em;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .ex-desc { margin:0 0 32px; font-family:"Gowun Batang", serif; font-size:1.125rem; line-height:1.95; word-break:keep-all; }
  .ex-quote { margin:0; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.9375rem; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
  .ex-quote span:first-child { display:block; font-size:.8125rem; margin-bottom:4px; }
  .result.reveal { animation:reveal .7s ease both; }
  @keyframes reveal { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body data-mood="calm">
<div class="app">
  <header class="top">
    <h1 class="brand">한 문장 전시실</h1>
    <div class="mode-switch" role="radiogroup" aria-label="생성 방식">
      <input type="radio" name="mode" id="mode-example" value="example" checked>
      <label for="mode-example">예제 모드</label>
      <input type="radio" name="mode" id="mode-ai" value="ai">
      <label for="mode-ai">AI 모드</label>
    </div>
  </header>

  <main class="layout">
    <form class="panel" id="form" novalidate>
      <div>
        <label class="field-label" for="sentence">전시가 될 문장</label>
        <textarea id="sentence" maxlength="300" aria-describedby="sentence-help counter"
          placeholder="예: 비가 그친 골목에서 오래된 노래가 들려왔다."></textarea>
        <div class="field-foot">
          <span id="sentence-help">1~300자 · Ctrl(⌘)+Enter로 바로 만들기</span>
          <span class="counter" id="counter">0 / 300</span>
        </div>
      </div>

      <fieldset>
        <legend>분위기</legend>
        <div class="chips">
          <input type="radio" name="mood" id="mood-calm" value="calm" checked>
          <label for="mood-calm"><span class="swatch calm" aria-hidden="true"></span>고요함</label>
          <input type="radio" name="mood" id="mood-warm" value="warm">
          <label for="mood-warm"><span class="swatch warm" aria-hidden="true"></span>따뜻함</label>
          <input type="radio" name="mood" id="mood-night" value="night">
          <label for="mood-night"><span class="swatch night" aria-hidden="true"></span>밤의 풍경</label>
        </div>
      </fieldset>

      <!-- AI 모드 전용 설정 -->
      <section class="ai-settings" id="ai-settings" hidden aria-labelledby="ai-settings-title">
        <p class="ai-settings-title" id="ai-settings-title">AI 설정</p>
        <fieldset id="provider-group">
          <legend>AI 서비스</legend>
          <div class="chips">
            <input type="radio" name="provider" id="provider-claude" value="claude" checked>
            <label for="provider-claude">Claude <span class="chip-note" data-note-for="claude"></span></label>
            <input type="radio" name="provider" id="provider-openai" value="openai">
            <label for="provider-openai">OpenAI <span class="chip-note" data-note-for="openai"></span></label>
          </div>
        </fieldset>
        <div>
          <label class="field-label" for="access-code">실습 접속 코드</label>
          <input class="text-input" type="password" id="access-code" autocomplete="off" spellcheck="false"
            aria-describedby="access-help" placeholder="수업에서 안내받은 코드">
          <p class="note" id="access-help" style="margin-top:6px">코드는 이 화면에 저장되지 않고, 만들 때마다 서버에서 확인합니다.</p>
        </div>
        <p class="note" id="ai-note" hidden></p>
      </section>

      <label class="example-only" id="example-only">
        <input type="checkbox" id="simulate-error"> 오류 응답 시험하기 (예제 모드 전용)
      </label>

      <button type="submit" class="submit" id="submit">
        <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
        <span id="submit-text">전시 문장 만들기</span>
      </button>

      <!-- 진행 상태 -->
      <div class="progress" id="progress" hidden>
        <div class="bar" aria-hidden="true"><span></span></div>
        <ol class="steps" aria-label="진행 단계">
          <li data-step="send">요청 보내기</li>
          <li data-step="wait"><span id="wait-label">AI가 제목과 설명을 쓰는 중</span>&nbsp;<span id="elapsed"></span></li>
          <li data-step="show">결과 걸기</li>
        </ol>
        <div class="progress-foot">
          <p class="note" id="progress-note">보통 3~10초 걸립니다.</p>
          <button type="button" class="ghost" id="cancel">취소</button>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="notice" id="error-box" role="alert" hidden>
        <p class="notice-title" id="error-message"></p>
        <p class="notice-hint" id="error-hint"></p>
        <button type="button" class="ghost" id="error-action"></button>
      </div>
    </form>

    <section class="wall" id="wall" aria-labelledby="wall-heading" aria-busy="false">
      <h2 class="visually-hidden" id="wall-heading">생성 결과</h2>
      <p class="empty" id="empty">문장을 적고 분위기를 고른 뒤 ‘전시 문장 만들기’를 누르면, 이 벽에 전시 제목과 소개 글이 걸립니다.</p>
      <article class="result" id="result" hidden>
        <p class="wall-meta">
          <span class="tag" id="res-mood"></span>
          <span class="tag source" id="res-source"></span>
        </p>
        <h3 class="ex-title" id="res-title"></h3>
        <p class="ex-desc" id="res-desc"></p>
        <blockquote class="ex-quote"><span>출발한 문장</span><span id="res-quote"></span></blockquote>
      </article>
    </section>
  </main>
</div>

<script>
/* ───────────────── 설정 ───────────────── */
const MAX_LEN = 300;
const CLIENT_TIMEOUT_MS = 40000;        // 서버(25초)보다 넉넉하게
const SLOW_NOTICE_SEC = 15;
const MOOD_LABEL = { calm: '고요함', warm: '따뜻함', night: '밤의 풍경' };
const PROVIDER_LABEL = { claude: 'Claude', openai: 'OpenAI' };

/* 예제 모드용 준비된 응답 (API 호출 없음) */
const SAMPLE_RESPONSES = {
  calm: [
    { title: '물결이 멈춘 자리', description: '움직임이 잦아든 뒤에야 들리는 것들이 있습니다. 이 전시는 한 문장이 남긴 정적을 따라가며, 비어 있는 시간 속에 고여 있는 감정을 천천히 들여다봅니다.' },
    { title: '흰 방의 오후', description: '창으로 들어온 빛이 벽을 건너는 동안, 말하지 못한 생각들이 제자리를 찾습니다. 서두르지 않는 시선으로 일상의 가장 조용한 순간을 다시 걸어 봅니다.' },
    { title: '숨을 고르는 풍경', description: '소리를 줄이면 보이기 시작하는 장면들을 모았습니다. 한 문장에서 출발한 여백이 관객 각자의 쉼표가 되기를 바랍니다.' }
  ],
  warm: [
    { title: '손끝에 남은 온기', description: '짧은 대화, 오래 쥐고 있던 컵의 따뜻함처럼 쉽게 사라지지 않는 감각을 모았습니다. 한 문장에서 시작된 기억이 관객의 하루로 번져 가도록 구성했습니다.' },
    { title: '오후 네 시의 빛', description: '해가 기울며 모든 것이 조금 더 부드러워지는 시간. 이 전시는 그 빛 아래 놓인 사람과 사물의 다정한 거리를 기록합니다.' },
    { title: '함께 끓는 저녁', description: '식탁 위에 오가는 웃음과 김이 오르는 냄비 사이, 우리를 이어 주는 작은 장면들을 펼쳐 놓았습니다. 문장 하나가 누군가를 부르는 이름이 됩니다.' }
  ],
  night: [
    { title: '불 꺼진 도시의 문장', description: '모두가 잠든 뒤에도 깨어 있는 창문들이 있습니다. 이 전시는 밤거리에서 주운 한 문장을 따라, 어둠 속에서 더 또렷해지는 마음의 윤곽을 비춥니다.' },
    { title: '가로등 아래 머문 생각', description: '하루의 소음이 빠져나간 길 위에서, 낮에는 보이지 않던 생각들이 불빛 아래 모여듭니다. 천천히 걸으며 읽는 밤의 기록입니다.' },
    { title: '새벽 두 시의 산책', description: '잠들지 못한 시간에도 풍경은 계속됩니다. 한 문장을 손전등 삼아 밤의 골목을 지나며, 혼자일 때 비로소 들리는 목소리를 따라갑니다.' }
  ]
};

/* ───────────────── 요소와 상태 ───────────────── */
const $ = (id) => document.getElementById(id);
const form = $('form'), sentenceEl = $('sentence'), accessEl = $('access-code');
const state = { mode: 'example', busy: false, controller: null, tick: null, startedAt: 0, config: null, configStatus: 'idle' };

/* ───────────────── 유틸 ───────────────── */
const wait = (ms, signal) => new Promise((resolve, reject) => {
  const t = setTimeout(resolve, ms);
  signal?.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); }, { once: true });
});
function hashText(text) { let h = 0; for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }
function checked(name) { return form.querySelector(`input[name="${name}"]:checked`)?.value; }
function appError(code, message, hint) { return Object.assign(new Error(message), { code, hint }); }

/* ───────────────── 상태 표시 ───────────────── */
function setStatus(message, type = 'info') { $('status').textContent = message; $('status').dataset.type = type; }

function hideError() { $('error-box').hidden = true; }

/* 오류 종류마다 이유 + 다시 시도하는 방법 + 바로 할 수 있는 버튼 */
const ERROR_ACTIONS = {
  ACCESS_CODE_REQUIRED: { label: '접속 코드 입력하기', run: () => { accessEl.setAttribute('aria-invalid', 'true'); accessEl.focus(); } },
  ACCESS_CODE_INVALID:  { label: '접속 코드 다시 입력', run: () => { accessEl.setAttribute('aria-invalid', 'true'); accessEl.select(); accessEl.focus(); } },
  INVALID_INPUT:        { label: '문장 고치기', run: () => { sentenceEl.setAttribute('aria-invalid', 'true'); sentenceEl.focus(); } },
  PROVIDER_NOT_CONFIGURED: { label: '다른 AI 선택하기', run: () => form.querySelector('input[name="provider"]:not(:checked):not(:disabled)')?.focus() },
  FILE_PROTOCOL:        { label: '예제 모드로 바꾸기', run: () => switchMode('example') },
  ACCESS_CODE_NOT_CONFIGURED: { label: '예제 모드로 바꾸기', run: () => switchMode('example') },
  PROVIDER_AUTH:        { label: '예제 모드로 바꾸기', run: () => switchMode('example') }
};

function showError(err) {
  const action = ERROR_ACTIONS[err.code] || { label: '다시 시도', run: () => form.requestSubmit() };
  $('error-message').textContent = err.message || '알 수 없는 문제가 생겼습니다.';
  $('error-hint').textContent = err.hint || '잠시 후 다시 시도하세요.';
  const btn = $('error-action');
  btn.textContent = action.label;
  btn.onclick = () => { hideError(); action.run(); };
  $('error-box').hidden = false;
  setStatus('');
}

function setBusy(busy) {
  state.busy = busy;
  $('submit').disabled = busy;
  $('spinner').hidden = !busy;
  $('submit-text').textContent = busy ? '만드는 중…' : '전시 문장 만들기';
  $('wall').setAttribute('aria-busy', String(busy));
  form.querySelectorAll('input[name="mood"], #simulate-error').forEach((el) => { el.disabled = busy; });
  document.querySelectorAll('input[name="mode"]').forEach((el) => { el.disabled = busy; });
  form.querySelectorAll('input[name="provider"]').forEach((el) => { el.disabled = busy || el.dataset.available === 'false'; });
  sentenceEl.readOnly = busy;
  accessEl.readOnly = busy;
}

/* 진행 단계 */
function setStep(step) {
  const order = ['send', 'wait', 'show'];
  const current = order.indexOf(step);
  document.querySelectorAll('.steps li').forEach((li) => {
    const i = order.indexOf(li.dataset.step);
    li.dataset.state = i < current ? 'done' : i === current ? 'active' : 'todo';
  });
}
function startProgress(mode, provider) {
  $('wait-label').textContent = mode === 'ai' ? `${PROVIDER_LABEL[provider]}가 제목과 설명을 쓰는 중` : '준비된 예제 응답 고르는 중';
  $('progress-note').textContent = mode === 'ai' ? '보통 3~10초 걸립니다.' : '예제 모드는 AI를 호출하지 않습니다.';
  $('elapsed').textContent = '';
  $('progress').hidden = false;
  setStep('send');
  state.startedAt = Date.now();
  state.tick = setInterval(() => {
    const sec = Math.floor((Date.now() - state.startedAt) / 1000);
    $('elapsed').textContent = `(${sec}초)`;
    if (mode === 'ai' && sec === SLOW_NOTICE_SEC) {
      $('progress-note').textContent = '평소보다 오래 걸리고 있습니다. 조금 더 기다리거나 취소 후 다시 시도하세요.';
    }
  }, 1000);
}
function stopProgress() { clearInterval(state.tick); $('progress').hidden = true; }

function updateCounter() {
  const len = sentenceEl.value.length;
  $('counter').textContent = `${len} / ${MAX_LEN}`;
  $('counter').classList.toggle('is-near', len >= MAX_LEN - 30);
}

/* ───────────────── 서버 설정 불러오기 ───────────────── */
async function loadConfig() {
  if (location.protocol === 'file:') { state.configStatus = 'file'; return renderConfig(); }
  try {
    const res = await fetch('/api/config', { cache: 'no-store' });
    if (!res.ok) throw new Error();
    state.config = await res.json();
    state.configStatus = 'ok';
  } catch {
    state.configStatus = 'fail';
  }
  renderConfig();
}

function renderConfig() {
  const note = $('ai-note');
  const setNote = (text, warn = true) => { note.textContent = text; note.hidden = !text; note.classList.toggle('is-warning', warn); };

  if (state.configStatus === 'file') return setNote('AI 모드는 Vercel에 배포한 주소(또는 vercel dev로 실행한 주소)에서 동작합니다. 지금은 예제 모드를 쓸 수 있습니다.');
  if (state.configStatus === 'fail') return setNote('서버 설정을 불러오지 못했습니다. 새로고침한 뒤 다시 시도하세요.');
  if (state.configStatus !== 'ok') return;

  const { providers, defaultProvider, accessCodeConfigured } = state.config;
  form.querySelectorAll('input[name="provider"]').forEach((el) => {
    const ok = Boolean(providers[el.value]);
    el.dataset.available = String(ok);
    el.disabled = !ok || state.busy;
    form.querySelector(`[data-note-for="${el.value}"]`).textContent = ok ? '' : '(키 미설정)';
  });
  if (defaultProvider && !state.providerTouched) $(`provider-${defaultProvider}`).checked = true;
  const current = form.querySelector('input[name="provider"]:checked');
  if (current && current.dataset.available === 'false') {
    const alt = form.querySelector('input[name="provider"][data-available="true"]');
    if (alt) alt.checked = true;
  }

  if (!providers.claude && !providers.openai) return setNote('서버에 AI API 키가 아직 없습니다. 관리자가 Vercel 환경 변수를 설정해야 합니다.');
  if (!accessCodeConfigured) return setNote('서버에 실습 접속 코드(ACCESS_CODE)가 아직 설정되지 않았습니다.');
  setNote('');
}

/* ───────────────── 생성: 예제 모드 ───────────────── */
async function requestExample(sentence, mood, signal) {
  await wait(300, signal);
  setStep('wait');
  await wait(800, signal);
  if ($('simulate-error').checked) {
    throw appError('EXAMPLE_ERROR', '예제 오류: 응답을 받지 못한 상황을 시험했습니다.', '‘오류 응답 시험하기’ 체크를 해제한 뒤 다시 시도하세요.');
  }
  const list = SAMPLE_RESPONSES[mood];
  return { ...list[hashText(sentence) % list.length] };
}

/* ───────────────── 생성: AI 모드 ───────────────── */
async function requestAi(payload, controller) {
  if (location.protocol === 'file:') {
    throw appError('FILE_PROTOCOL', 'AI 모드는 파일을 직접 열면 동작하지 않습니다.', 'Vercel에 배포한 주소나 vercel dev로 실행한 주소에서 열어 주세요.');
  }
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; controller.abort(); }, CLIENT_TIMEOUT_MS);
  try {
    const pending = fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    setStep('wait');
    const res = await pending;
    let data = null;
    try { data = await res.json(); } catch { /* JSON이 아닌 응답 */ }

    if (!res.ok) {
      if (data?.error) throw appError(data.error.code, data.error.message, data.error.hint);
      if (res.status === 504) throw appError('TIMEOUT', '서버 처리 시간이 초과되었습니다.', '잠시 후 다시 시도하세요. 계속되면 다른 AI 서비스를 선택해 보세요.');
      throw appError('SERVER_ERROR', `서버가 ${res.status} 오류로 응답했습니다.`, '잠시 후 다시 시도하세요.');
    }
    if (!data || typeof data.title !== 'string' || typeof data.description !== 'string') {
      throw appError('BAD_AI_RESPONSE', '서버 응답 형식이 올바르지 않습니다.', '다시 시도하세요.');
    }
    return data;
  } catch (err) {
    if (err.name === 'AbortError') {
      throw timedOut
        ? appError('TIMEOUT', `${CLIENT_TIMEOUT_MS / 1000}초가 지나도 응답이 없어 요청을 멈췄습니다.`, '잠시 후 다시 시도하세요. 계속되면 다른 AI 서비스를 선택해 보세요.')
        : appError('CANCELLED');
    }
    if (err instanceof TypeError) {
      throw appError('NETWORK', '서버에 연결하지 못했습니다.', '인터넷 연결을 확인한 뒤 다시 시도하세요.');
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ───────────────── 결과 표시 ───────────────── */
function renderResult({ title, description }, { sentence, mood, source, provider }) {
  $('res-title').textContent = title;
  $('res-desc').textContent = description;
  $('res-quote').textContent = `“${sentence}”`;
  $('res-mood').textContent = MOOD_LABEL[mood];
  const tag = $('res-source');
  tag.dataset.source = source;
  tag.textContent = source === 'ai' ? `${PROVIDER_LABEL[provider]} 생성` : '예제 응답';
  $('empty').hidden = true;
  const result = $('result');
  result.hidden = false;
  result.classList.remove('reveal');
  void result.offsetWidth;
  result.classList.add('reveal');
}

/* ───────────────── 만들기 ───────────────── */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.busy) return; // 중복 클릭 방지
  hideError();

  const sentence = sentenceEl.value.trim();
  const mood = checked('mood');
  const mode = state.mode;
  const provider = checked('provider');

  if (!sentence) return showError(appError('INVALID_INPUT', '문장을 1자 이상 입력하세요.', '전시의 출발점이 될 문장을 적은 뒤 다시 만드세요.'));
  if (sentence.length > MAX_LEN) return showError(appError('INVALID_INPUT', `문장은 ${MAX_LEN}자 이하로 입력하세요.`, `지금은 ${sentence.length}자입니다.`));

  let accessCode = '';
  if (mode === 'ai') {
    accessCode = accessEl.value.trim();
    if (!accessCode) return showError(appError('ACCESS_CODE_REQUIRED', '실습 접속 코드를 입력하세요.', '수업에서 안내받은 코드를 AI 설정의 접속 코드 칸에 입력한 뒤 다시 만드세요.'));
    if (!provider) return showError(appError('PROVIDER_NOT_CONFIGURED', '사용할 수 있는 AI 서비스가 없습니다.', '관리자가 Vercel 환경 변수에 API 키를 추가해야 합니다. 그동안 예제 모드를 쓰세요.'));
  }

  const controller = new AbortController();
  state.controller = controller;
  setBusy(true);
  setStatus('');
  startProgress(mode, provider);

  try {
    const result = mode === 'ai'
      ? await requestAi({ sentence, mood, provider, accessCode }, controller)
      : await requestExample(sentence, mood, controller.signal);
    setStep('show');
    renderResult(result, { sentence, mood, source: mode, provider });
    setStatus(mode === 'ai'
      ? `${PROVIDER_LABEL[provider]}로 전시 문장을 만들었습니다.`
      : '예제 응답을 걸었습니다. 실제 생성은 AI 모드에서 할 수 있습니다.', 'success');
  } catch (err) {
    if (err.code === 'CANCELLED' || err.name === 'AbortError') {
      setStatus('만들기를 취소했습니다. 다시 만들려면 버튼을 누르세요.');
    } else {
      showError(err);
    }
  } finally {
    stopProgress();
    setBusy(false);
    state.controller = null;
  }
});

/* ───────────────── 기타 이벤트 ───────────────── */
$('cancel').addEventListener('click', () => state.controller?.abort());

sentenceEl.addEventListener('input', () => { updateCounter(); sentenceEl.removeAttribute('aria-invalid'); });
sentenceEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
});
accessEl.addEventListener('input', () => accessEl.removeAttribute('aria-invalid'));

form.querySelectorAll('input[name="mood"]').forEach((el) =>
  el.addEventListener('change', () => { document.body.dataset.mood = el.value; }));
form.querySelectorAll('input[name="provider"]').forEach((el) =>
  el.addEventListener('change', () => { state.providerTouched = true; }));

function switchMode(mode) {
  state.mode = mode;
  $(`mode-${mode}`).checked = true;
  $('ai-settings').hidden = mode !== 'ai';
  $('example-only').hidden = mode !== 'example';
  hideError();
  setStatus(mode === 'ai'
    ? 'AI 모드: 접속 코드를 입력하면 선택한 AI가 문장에 맞는 전시 제목과 설명을 씁니다.'
    : '예제 모드: AI 없이 준비된 응답을 보여 줍니다.');
  if (mode === 'ai' && state.configStatus !== 'ok') loadConfig();
}
document.querySelectorAll('input[name="mode"]').forEach((el) =>
  el.addEventListener('change', () => switchMode(el.value)));

updateCounter();
switchMode('example');
loadConfig();
</script>
</body>
</html>
